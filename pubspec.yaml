name: beoncosmetic
description: "Beon Cosmetic - Order Management System"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend & Auth
  supabase_flutter: ^2.8.4
  flutter_dotenv: ^5.2.1

  # Navigation
  go_router: ^14.8.1

  # Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Security & Biometrics
  local_auth: ^2.3.0

  # File handling & Export
  pdf: ^3.11.2
  printing: ^5.13.5
  excel: ^4.0.6
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  flutter_slidable: ^4.0.0
  http: ^1.3.0
  http_parser: ^4.1.1
  mime: ^2.0.0
  crypto: ^3.0.6

  # Barcode
  barcode_widget: ^2.0.4

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  collection: ^1.19.1
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint: ^0.7.1
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#0A0A0F"
  android: true
  ios: false
  android_12:
    color: "#0A0A0F"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/outer_app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/logo/
